<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Fantasy AI Agents</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background: #0a0e1a !important; color: #e8eaf0 !important; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🏈 NFL Fantasy AI</div>
        <div class="nav-links">
            <a href="/" class="nav-link">Inicio</a>
            <a href="/draft" class="nav-link">Draft</a>
            <a href="/weekly" class="nav-link">Semanal</a>
            <a href="/waiver" class="nav-link">Waivers</a>
            <a href="/roster" class="nav-link">Mi Roster</a>
            <a href="/league" class="nav-link">Liga</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>
        function formatMarkdown(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/#{3}\s(.+)/g, '<h3>$1</h3>')
                .replace(/#{2}\s(.+)/g, '<h2>$1</h2>')
                .replace(/#{1}\s(.+)/g, '<h1>$1</h1>')
                .replace(/\n---\n/g, '<hr>')
                .replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
